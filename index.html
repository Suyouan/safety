<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- Allow pinch-zoom for accessibility -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>安全文化與安全意識</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code 生成與 HTML5 相機掃描 Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- PWA 標籤設定 (讓手機識別為 APP) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="安全文化與意識">
    <meta name="theme-color" content="#ffffff">

    <!-- 動態產生 PWA Manifest -->
    <script>
        const manifest = {
            "name": "安全文化與安全意識",
            "short_name": "安全文化與意識",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#f9fafb",
            "theme_color": "#ffffff",
            "icons": [{
                "src": "https://cdn-icons-png.flaticon.com/512/1006/1006771.png",
                "sizes": "512x512",
                "type": "image/png"
            }]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .iso-triangle { clip-path: polygon(50% 5%, 0% 95%, 100% 95%); }
        .iso-circle { border-radius: 50%; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-24 min-h-screen relative select-none">

    <!-- 1. 左上角 1/9 區隱藏觸發後台 (連擊 3 下) -->
    <div onclick="handleAdminTrigger()" aria-hidden="true" tabindex="-1" class="fixed top-0 left-0 w-1/3 h-1/3 z-50 cursor-pointer opacity-0" title="隱藏區域：連點3下進入後台審批"></div>

    <!-- 2. 頂部導覽列 -->
    <header class="sticky top-0 bg-white/90 backdrop-blur-md border-b border-gray-200 z-40 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 bg-amber-400 text-slate-900 rounded-lg flex items-center justify-center font-black text-sm shadow-sm">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <span class="font-bold text-gray-900 tracking-tight text-base">安全文化與安全意識</span>
            </div>
            <span class="text-[11px] font-semibold bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full border border-emerald-200">PWA 版</span>
        </div>
    </header>

    <!-- 3. 三大快捷鍵 (T / 相機 / 資料庫) -->
    <section class="max-w-md mx-auto px-4 mt-4">
        <div class="grid grid-cols-3 gap-3 bg-white p-2 rounded-2xl border border-gray-200 shadow-sm">
            <!-- T 文字搜尋 -->
            <button onclick="openSearchModal()" class="flex flex-col items-center justify-center py-3 rounded-xl bg-gray-50 hover:bg-amber-50 active:scale-95 transition border border-gray-100">
                <div class="w-10 h-10 rounded-full bg-amber-400 text-slate-900 flex items-center justify-center font-extrabold text-xl mb-1 shadow-sm">T</div>
                <span class="text-xs font-bold text-gray-700">文字搜尋</span>
            </button>
            <!-- 📷 相機掃碼 -->
            <button onclick="openScannerModal()" class="flex flex-col items-center justify-center py-3 rounded-xl bg-gray-50 hover:bg-blue-50 active:scale-95 transition border border-gray-100">
                <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center text-lg mb-1 shadow-sm">
                    <i class="fa-solid fa-camera"></i>
                </div>
                <span class="text-xs font-bold text-gray-700">相機掃碼</span>
            </button>
            <!-- 📦 資料庫 -->
            <button onclick="showDatabaseView()" class="flex flex-col items-center justify-center py-3 rounded-xl bg-gray-50 hover:bg-emerald-50 active:scale-95 transition border border-gray-100">
                <div class="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center text-lg mb-1 shadow-sm">
                    <i class="fa-solid fa-database"></i>
                </div>
                <span class="text-xs font-bold text-gray-700">完整資料庫</span>
            </button>
        </div>
    </section>

    <!-- 4. 主要內容區域 (標誌詳情頁 / 全覽資料庫) -->
    <main id="app-content" class="max-w-md mx-auto px-4 mt-6">
        <!-- 內容會由 JavaScript 動態渲染 -->
    </main>

    <!-- 5. 搜尋 Modal 彈窗 -->
    <div id="search-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
            <h3 class="font-bold text-gray-900 text-base">輸入流水 ID 查詢標誌</h3>
            <input type="text" id="search-input" placeholder="例如: W-Electric-L4 或 P-NoSmoking" class="w-full border border-gray-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500">
            <div class="flex space-x-2">
                <button onclick="closeSearchModal()" class="w-1/2 py-2.5 rounded-xl border border-gray-300 text-gray-600 font-medium text-sm">取消</button>
                <button onclick="performSearch()" class="w-1/2 py-2.5 rounded-xl bg-amber-400 text-slate-900 font-bold text-sm">查詢</button>
            </div>
        </div>
    </div>

    <!-- 6. 相機掃描器 Modal 彈窗 -->
    <div id="scanner-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center px-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl space-y-3 relative">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-900 text-sm">對準標誌上的 QR-Code</h3>
                <button onclick="closeScannerModal()" class="text-gray-400 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="reader" class="w-full rounded-xl overflow-hidden bg-black"></div>
        </div>
    </div>

    <!-- 7. 後台審批流程 Modal (左上角連擊 3 下觸發) -->
    <div id="admin-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <div class="flex items-center space-x-2">
                    <span class="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold">後台</span>
                    <h3 class="font-bold text-gray-900 text-base">待審批流程清單</h3>
                </div>
                <button onclick="closeAdminModal()" class="text-gray-400 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="admin-queue" class="overflow-y-auto space-y-3 flex-1 pr-1">
                <!-- 待審批項目動態載入 -->
            </div>
        </div>
    </div>

    <!-- 8. PWA 安裝導引底部框 -->
    <div id="pwa-toast" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-white border border-gray-300 p-3.5 rounded-2xl shadow-xl flex items-center justify-between text-xs z-30">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-amber-400 text-slate-900 rounded-lg flex items-center justify-center font-bold text-sm flex-shrink-0">
                <i class="fa-solid fa-mobile-screen"></i>
            </div>
            <div>
                <span class="font-bold text-gray-900 block">新增至手機主畫面</span>
                <span id="pwa-instructions" class="text-gray-500">點擊瀏覽器「分享」並選擇「加入主畫面」</span>
            </div>
        </div>
        <button onclick="document.getElementById('pwa-toast').remove()" class="text-gray-400 p-1">
            <i class="fa-solid fa-xmark text-base"></i>
        </button>
    </div>

    <!-- 核心應用邏輯 Script -->
    <script>
        // Utility: Escape text to prevent HTML injection (XSS)
        function escapeHTML (str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ISO 7010:2019 資料庫預設資料
        const database = [
            {
                id: "W-Electric-L4",
                category: "W",
                categoryName: "警告標誌",
                name: "感電注意 (Electricity Danger)",
                level: 4,
                iconClass: "fa-bolt",
                details: {
                    frequency: "高 (高壓設備區域)",
                    riskLevel: "極高 (等級 4)",
                    elimination: "高壓檢修作業實施斷電",
                    substitution: "升級低壓防爆電路控制",
                    engineering: "加裝絕緣保護罩與漏電斷路器",
                    administrative: "設置警示標示與作業簽核",
                    ppe: "絕緣手套、絕緣鞋、防電弧面罩"
                }
            },
            {
                id: "W-Slip-L2",
                category: "W",
                categoryName: "警告標誌",
                name: "滑倒危險 (Slippery Surface)",
                level: 2,
                iconClass: "fa-person-falling-burst",
                details: {
                    frequency: "中 (地面積水區)",
                    riskLevel: "中等 (等級 2)",
                    elimination: "定期清理地面油污",
                    substitution: "鋪設防滑吸油墊",
                    engineering: "加設止滑條與排水溝槽",
                    administrative: "濕滑期間設置警告立牌",
                    ppe: "防滑安全鞋"
                }
            },
            {
                id: "P-NoSmoking",
                category: "P",
                categoryName: "禁止標誌",
                name: "禁止吸菸 (No Smoking)",
                level: null,
                iconClass: "fa-ban-smoking",
                details: null
            },
            {
                id: "M-EyeProtection",
                category: "M",
                categoryName: "強制標誌",
                name: "佩戴護目鏡 (Wear Eye Protection)",
                level: null,
                iconClass: "fa-glasses",
                details: null
            }
        ];

        // 待審批資料庫 (儲存於 LocalStorage) - safe parse
        let approvalQueue = [];
        try {
            const raw = localStorage.getItem('approvalQueue');
            const parsed = raw ? JSON.parse(raw) : null;
            if (Array.isArray(parsed)) approvalQueue = parsed;
        } catch (e) {
            console.warn('Could not parse approvalQueue from localStorage, resetting.', e);
            approvalQueue = [];
            localStorage.removeItem('approvalQueue');
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderSignDetail("W-Electric-L4");
            setupPWAInstructions();
        });

        // 渲染指定標誌的詳細頁面 (與文字搜尋/相機掃碼顯示一致)
        function renderSignDetail(id) {
            const item = database.find(x => x.id === id);
            const container = document.getElementById('app-content');

            if (!item) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl text-center border border-gray-200 shadow-sm">
                        <i class="fa-solid fa-triangle-exclamation text-amber-500 text-4xl mb-3"></i>
                        <h3 class="font-bold text-gray-800">找不到該標誌</h3>
                        <p class="text-xs text-gray-500 mt-1">流水號: ${escapeHTML(id)}</p>
                        <button onclick="showDatabaseView()" class="mt-4 bg-amber-400 px-4 py-2 rounded-xl text-xs font-bold">回到完整資料庫</button>
                    </div>`;
                return;
            }

            let isWarning = item.category === 'W';
            let shapeHtml = '';

            if (isWarning) {
                shapeHtml = `
                    <div class="flex flex-col items-center">
                        <div class="w-20 h-18 bg-amber-400 iso-triangle flex items-center justify-center shadow-sm">
                            <i class="fa-solid ${escapeHTML(item.iconClass)} text-slate-900 text-2xl mt-3"></i>
                        </div>
                        <span class="text-xs font-black text-amber-900 bg-amber-300 px-3 py-0.5 rounded-full mt-1.5 border border-amber-400">
                            LV. ${escapeHTML(item.level === null ? '' : String(item.level))}
                        </span>
                    </div>`;
            } else {
                let bg = item.category === 'P' ? 'bg-red-600' : 'bg-blue-600';
                shapeHtml = `
                    <div class="flex flex-col items-center">
                        <div class="w-16 h-16 ${bg} iso-circle flex items-center justify-center text-white text-2xl shadow-sm">
                            <i class="fa-solid ${escapeHTML(item.iconClass)}"></i>
                        </div>
                    </div>`;
            }

            let detailsHtml = '';
            if (isWarning && item.details) {
                const keys = [
                    { k: 'frequency', name: '1. 發生頻率' },
                    { k: 'riskLevel', name: '2. 風險等級', isRed: true },
                    { k: 'elimination', name: '3. 消除' },
                    { k: 'substitution', name: '4. 取代' },
                    { k: 'engineering', name: '5. 工程管制' },
                    { k: 'administrative', name: '6. 行政管制' }
                ];

                let gridItems = keys.map(f => `
                    <div ondblclick="triggerFieldEdit('${escapeHTML(item.id)}', '${escapeHTML(f.name)}', '${escapeHTML(item.details[f.k])}')" 
                         class="p-2.5 ${f.isRed ? 'bg-red-50 hover:bg-red-100 border-red-200 text-red-700' : 'bg-gray-50 hover:bg-amber-50 border-gray-200 text-gray-800'} rounded-lg border cursor-pointer transition">
                        <div class="text-[10px] text-gray-400">${escapeHTML(f.name)}</div>
                        <div class="font-bold mt-0.5 text-xs">${escapeHTML(item.details[f.k])}</div>
                    </div>`).join('');

                detailsHtml = `
                    <div class="space-y-3 pt-2">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-gray-800 flex items-center gap-1.5">
                                <i class="fa-solid fa-clipboard-list text-amber-500"></i> 風險與控制措施子目錄
                            </h4>
                            <span class="text-[10px] text-gray-400">💡 雙擊框格編輯</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            ${gridItems}
                        </div>
                        <div ondblclick="triggerFieldEdit('${escapeHTML(item.id)}', '7. 個人防護用具 (PPE)', '${escapeHTML(item.details.ppe)}')" 
                             class="p-2.5 bg-gray-50 hover:bg-amber-50 rounded-lg border border-gray-200 cursor-pointer transition text-xs">
                            <div class="text-[10px] text-gray-400">7. 個   防護用具 (PPE)</div>
                            <div class="font-bold text-gray-800 mt-0.5 text-xs">${escapeHTML(item.details.ppe)}</div>
                        </div>
                    </div>`;
            }

            container.innerHTML = `
                <div class="bg-white rounded-2xl border border-gray-200 p-5 shadow-sm space-y-4">
                    <div class="flex justify-between items-start border-b border-gray-100 pb-3">
                        <div>
                            <span class="text-xs font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-200">${escapeHTML(item.categoryName)}</span>
                            <h3 class="text-base font-bold text-gray-900 mt-1">${escapeHTML(item.name)}</h3>
                        </div>
                        <span class="text-[11px] font-mono font-bold bg-gray-100 px-2 py-1 rounded text-gray-600 border border-gray-200">
                            ID: ${escapeHTML(item.id)}
                        </span>
                    </div>

                    <div class="flex items-center justify-around py-3 bg-gray-50 rounded-xl border border-gray-100">
                        ${shapeHtml}
                        <div class="flex flex-col items-center">
                            <div id="qrcode-container" class="p-2 bg-white rounded-lg border border-gray-200 shadow-sm"></div>
                            <span class="text-[10px] text-gray-400 mt-1">專屬 QR-Code</span>
                        </div>
                    </div>

                    ${detailsHtml}
                </div>`;

            // 即時動態生成專屬 QR Code
            setTimeout(() => {
                const qrContainer = document.getElementById("qrcode-container");
                if (qrContainer) {
                    qrContainer.innerHTML = "";
                    new QRCode(qrContainer, {
                        text: item.id,
                        width: 64,
                        height: 64
                    });
                }
            }, 50);
        }

        // 展示全覽資料庫
        function showDatabaseView() {
            const container = document.getElementById('app-content');
            let cards = database.map(item => `
                <div onclick="renderSignDetail('${escapeHTML(item.id)}')" class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between active:scale-[0.98] transition cursor-pointer">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 ${item.category === 'W' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'} rounded-lg flex items-center justify-center text-lg font-bold">
                            <i class="fa-solid ${escapeHTML(item.iconClass)}"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-sm text-gray-900">${escapeHTML(item.name)}</h4>
                            <span class="text-[10px] font-mono text-gray-400">${escapeHTML(item.id)}</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-300 text-xs"></i>
                </div>`).join('');

            container.innerHTML = `
                <div class="space-y-3">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-gray-800 text-sm">完整 ISO 7010 安全標誌庫</h3>
                        <span class="text-xs text-gray-400">共 ${database.length} 筆</span>
                    </div>
                    ${cards}
                </div>`;
        }

        // 雙擊欄位進行編輯輸入 (進入待審批流程)
        function triggerFieldEdit(signId, fieldName, currentValue) {
            const newValue = prompt(`[待審批提交]\n請輸入新的「${fieldName}」內容：`, currentValue);
            if (newValue !== null) {
                const trimmed = String(newValue).trim();
                if (trimmed.length === 0) return; // empty - do nothing
                if (trimmed.length > 800) {
                    alert('輸入文字過長，請限制在 800 字以內。');
                    return;
                }
                if (trimmed !== currentValue) {
                    const record = {
                        id: Date.now(),
                        signId: signId,
                        field: fieldName,
                        value: trimmed,
                        time: new Date().toLocaleString('zh-TW')
                    };
                    approvalQueue.push(record);
                    try { localStorage.setItem('approvalQueue', JSON.stringify(approvalQueue)); } catch(e){ console.warn('Could not save approvalQueue', e); }
                    alert(`提交成功！\n欄位：${fieldName}\n內容：${trimmed}\n\n已傳送至後台【待審批狀態】，經審核通過後方會生效。`);
                }
            }
        }

        // 搜尋 Modal 邏輯
        function openSearchModal() {
            document.getElementById('search-modal').classList.remove('hidden');
        }
        function closeSearchModal() {
            document.getElementById('search-modal').classList.add('hidden');
        }
        function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (query) {
                closeSearchModal();
                renderSignDetail(query);
            }
        }

        // 相機掃碼器 (html5-qrcode) - improved cleanup and error handling
        let html5QrCode = null;
        function openScannerModal() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 200, height: 200 } },
                (decodedText) => {
                    closeScannerModal();
                    renderSignDetail(decodedText);
                },
                (errorMessage) => {}
            ).catch(err => {
                console.error('QR start failed:', err);
                closeScannerModal();
                alert('無法啟動相機，請檢查權限或裝置支援');
            });
        }
        function closeScannerModal() {
            if (html5QrCode) {
                html5QrCode.stop()
                    .then(() => {
                        try { html5QrCode.clear(); } catch(e) { /* ignore */ }
                    })
                    .catch((stopErr) => {
                        console.warn('Error stopping html5QrCode:', stopErr);
                        try { html5QrCode.clear(); } catch(e) { /* ignore */ }
                    })
                    .finally(() => {
                        html5QrCode = null;
                        document.getElementById('scanner-modal').classList.add('hidden');
                    });
            } else {
                document.getElementById('scanner-modal').classList.add('hidden');
            }
        }

        // 左上角 1/9 區連擊 3 下進入後台
        let clickCount = 0;
        let clickTimer = null;
        function handleAdminTrigger() {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount === 3) {
                openAdminModal();
                clickCount = 0;
            } else {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
            }
        }

        // Open admin modal - render using DOM APIs to avoid HTML injection
        function openAdminModal() {
            const queueContainer = document.getElementById('admin-queue');
            queueContainer.innerHTML = '';
            if (approvalQueue.length === 0) {
                const p = document.createElement('p');
                p.className = 'text-xs text-gray-400 text-center py-6';
                p.textContent = '目前沒有待審批的提交資料。';
                queueContainer.appendChild(p);
            } else {
                approvalQueue.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'p-3 bg-gray-50 border border-gray-200 rounded-xl space-y-2 text-xs';

                    const header = document.createElement('div');
                    header.className = 'flex justify-between font-bold text-gray-700';

                    const pathSpan = document.createElement('span');
                    pathSpan.textContent = `路徑: ${item.signId}`;

                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'text-[10px] text-gray-400';
                    timeSpan.textContent = item.time;

                    header.appendChild(pathSpan);
                    header.appendChild(timeSpan);

                    const fieldDiv = document.createElement('div');
                    fieldDiv.className = 'text-gray-600';
                    // field name originates from UI; escape when inserting as HTML
                    const bold = document.createElement('b');
                    bold.className = 'text-gray-900';
                    bold.textContent = item.field;
                    fieldDiv.textContent = '欄位: ';
                    fieldDiv.appendChild(bold);

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'text-gray-800 bg-white p-2 rounded border border-gray-100';
                    contentDiv.textContent = item.value; // use textContent to prevent injection

                    const controls = document.createElement('div');
                    controls.className = 'flex justify-end space-x-2 pt-1';

                    const btnReject = document.createElement('button');
                    btnReject.className = 'px-3 py-1 bg-gray-200 text-gray-700 rounded font-bold';
                    btnReject.textContent = '駁回';
                    btnReject.addEventListener('click', () => rejectApproval(item.id));

                    const btnApprove = document.createElement('button');
                    btnApprove.className = 'px-3 py-1 bg-emerald-600 text-white rounded font-bold';
                    btnApprove.textContent = '通過';
                    btnApprove.addEventListener('click', () => approveApproval(item.id));

                    controls.appendChild(btnReject);
                    controls.appendChild(btnApprove);

                    card.appendChild(header);
                    card.appendChild(fieldDiv);
                    card.appendChild(contentDiv);
                    card.appendChild(controls);

                    queueContainer.appendChild(card);
                });
            }
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function approveApproval(id) {
            const item = approvalQueue.find(x => x.id === id);
            if (item) {
                const targetSign = database.find(x => x.id === item.signId);
                if (targetSign && targetSign.details) {
                    // validate and write back safely (trim length)
                    const safeVal = String(item.value).slice(0, 1000);
                    if(item.field.includes("發生頻率")) targetSign.details.frequency = safeVal;
                    if(item.field.includes("風險等級")) targetSign.details.riskLevel = safeVal;
                    if(item.field.includes("消除")) targetSign.details.elimination = safeVal;
                    if(item.field.includes("取代")) targetSign.details.substitution = safeVal;
                    if(item.field.includes("工程管制")) targetSign.details.engineering = safeVal;
                    if(item.field.includes("行政管制")) targetSign.details.administrative = safeVal;
                    if(item.field.includes("個人防護")) targetSign.details.ppe = safeVal;
                }
                approvalQueue = approvalQueue.filter(x => x.id !== id);
                try { localStorage.setItem('approvalQueue', JSON.stringify(approvalQueue)); } catch(e){ console.warn('Could not save approvalQueue', e); }
                openAdminModal();
                renderSignDetail(item.signId);
                alert("審批已通過並更新資料！");
            }
        }

        function rejectApproval(id) {
            approvalQueue = approvalQueue.filter(x => x.id !== id);
            try { localStorage.setItem('approvalQueue', JSON.stringify(approvalQueue)); } catch(e){ console.warn('Could not save approvalQueue', e); }
            openAdminModal();
        }

        // PWA iOS/Android 操作指引判斷
        function setupPWAInstructions() {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const el = document.getElementById('pwa-instructions');
            if (isIOS) {
                el.innerHTML = '點擊下方 <i class="fa-solid fa-share-from-square text-amber-500"></i> 分享按鈕，選擇<b>「加入主畫面」</b>';
            } else {
                el.innerHTML = '點擊右上角選單，選擇<b>「安裝應用程式」</b>或<b>「新增至主畫面」</b>';
            }
            if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
                document.getElementById('pwa-toast').style.display = 'none';
            }
        }

        // Note: consider adding role="dialog" and focus-trap for better accessibility on the modals
    </script>
