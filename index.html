<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>安全文化與意識</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code 生成與 HTML5 相機掃描 Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- PWA Meta 設定 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="安全文化與意識">
    <meta name="theme-color" content="#ffffff">

    <!-- 動態生成 PWA Web App Manifest -->
    <script>
        const manifestData = {
            "name": "安全文化與意識",
            "short_name": "安全文化",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#f9fafb",
            "theme_color": "#ffffff",
            "icons": [{
                "src": "https://cdn-icons-png.flaticon.com/512/1006/1006771.png",
                "sizes": "512x512",
                "type": "image/png"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        
        /* ISO 7010 黃色警告三角形樣式 */
        .iso-triangle-container {
            width: 0;
            height: 0;
            border-left: 45px solid transparent;
            border-right: 45px solid transparent;
            border-bottom: 78px solid #f59e0b;
            position: relative;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
        }
        .iso-triangle-icon {
            position: absolute;
            top: 38px;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f172a;
            font-size: 1.5rem;
        }

        /* 圓形 (禁止/強制/救援) */
        .iso-circle { border-radius: 50%; }

        /* 文字截斷 (多行截斷並顯示 ...) */
        .truncate-text {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-24 min-h-screen relative select-none">

    <!-- 1. 頂部導覽列 (多國語言切換 + 長按觸發後台主標題) -->
    <header class="sticky top-0 bg-white/95 backdrop-blur-md border-b border-gray-200 z-40 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <!-- 核心主標題：長按 3 秒觸發審批流程 -->
            <div id="main-title" class="flex items-center space-x-2.5 cursor-pointer active:opacity-70 transition relative">
                <div class="w-8 h-8 bg-amber-400 text-slate-900 rounded-lg flex items-center justify-center font-black text-sm shadow-sm">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1 id="ui-title" class="font-bold text-gray-900 tracking-tight text-base leading-tight">安全文化與意識</h1>
                    <span id="ui-title-hint" class="text-[10px] text-gray-400 block">💡 長按標題 3 秒進入審批後台</span>
                </div>
            </div>

            <!-- 語言切換選單 (繁體中文 / English / Deutsch) -->
            <div class="flex items-center space-x-1.5">
                <select id="lang-select" onchange="changeLanguage(this.value)" class="text-xs border border-gray-200 rounded-lg px-2 py-1 bg-gray-50 text-gray-700 font-medium focus:outline-none focus:border-amber-400">
                    <option value="zh">繁中</option>
                    <option value="en">EN</option>
                    <option value="de">DE</option>
                </select>
                <span class="text-[11px] font-semibold bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full border border-emerald-200">PWA</span>
            </div>
        </div>
    </header>

    <!-- 2. 三大快捷鍵 (T / 相機 / 資料庫) -->
    <section class="max-w-md mx-auto px-4 mt-4">
        <div class="grid grid-cols-3 gap-3 bg-white p-2 rounded-2xl border border-gray-200 shadow-sm">
            <!-- T 文字搜尋 -->
            <button onclick="openSearchModal()" class="flex flex-col items-center justify-center py-3 rounded-xl bg-gray-50 hover:bg-amber-50 active:scale-95 transition border border-gray-100">
                <div class="w-10 h-10 rounded-full bg-amber-400 text-slate-900 flex items-center justify-center font-extrabold text-xl mb-1 shadow-sm">T</div>
                <span id="ui-btn-search" class="text-xs font-bold text-gray-700">文字搜尋</span>
            </button>
            <!-- 📷 相機掃碼 -->
            <button onclick="openScannerModal()" class="flex flex-col items-center justify-center py-3 rounded-xl bg-gray-50 hover:bg-blue-50 active:scale-95 transition border border-gray-100">
                <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center text-lg mb-1 shadow-sm">
                    <i class="fa-solid fa-camera"></i>
                </div>
                <span id="ui-btn-camera" class="text-xs font-bold text-gray-700">相機掃碼</span>
            </button>
            <!-- 📦 資料庫 -->
            <button onclick="showDatabaseView()" class="flex flex-col items-center justify-center py-3 rounded-xl bg-gray-50 hover:bg-emerald-50 active:scale-95 transition border border-gray-100">
                <div class="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center text-lg mb-1 shadow-sm">
                    <i class="fa-solid fa-database"></i>
                </div>
                <span id="ui-btn-db" class="text-xs font-bold text-gray-700">完整資料庫</span>
            </button>
        </div>
    </section>

    <!-- 3. 主要內容渲染區 -->
    <main id="app-content" class="max-w-md mx-auto px-4 mt-5">
        <!-- JS 動態載入畫面 -->
    </main>

    <!-- Modal: 文字查詢 (T) -->
    <div id="search-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
            <h3 id="ui-search-title" class="font-bold text-gray-900 text-base">輸入流水編號查詢標誌</h3>
            <p id="ui-search-hint" class="text-xs text-gray-500">格式：英文類別-意思(-等級)</p>
            <input type="text" id="search-input" placeholder="W-ElectricDanger-L4" class="w-full border border-gray-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500">
            <div class="flex space-x-2">
                <button onclick="closeSearchModal()" id="ui-cancel-btn" class="w-1/2 py-2.5 rounded-xl border border-gray-300 text-gray-600 font-medium text-sm">取消</button>
                <button onclick="performSearch()" id="ui-confirm-btn" class="w-1/2 py-2.5 rounded-xl bg-amber-400 text-slate-900 font-bold text-sm">確認</button>
            </div>
        </div>
    </div>

    <!-- Modal: 相機掃碼 -->
    <div id="scanner-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center px-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl space-y-3 relative">
            <div class="flex justify-between items-center">
                <h3 id="ui-scanner-title" class="font-bold text-gray-900 text-sm">對準標誌上的 QR-Code</h3>
                <button onclick="closeScannerModal()" class="text-gray-400 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="reader" class="w-full rounded-xl overflow-hidden bg-black min-h-[220px] flex items-center justify-center"></div>
        </div>
    </div>

    <!-- Modal: 後台審批流程 -->
    <div id="admin-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <div class="flex items-center space-x-2">
                    <span class="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold">Admin</span>
                    <h3 id="ui-admin-title" class="font-bold text-gray-900 text-base">待審批流程矩陣</h3>
                </div>
                <button onclick="closeAdminModal()" class="text-gray-400 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="admin-queue" class="overflow-y-auto space-y-3 flex-1 pr-1">
                <!-- 審批佇列動態載入 -->
            </div>
        </div>
    </div>

    <!-- Modal: 詳細內容展開視窗 (長按 3 秒觸發) -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h4 id="detail-modal-title" class="font-bold text-gray-900 text-sm">詳細內容</h4>
                <button onclick="closeDetailModal()" class="text-gray-400 p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="detail-modal-body" class="text-xs text-gray-700 space-y-2 max-h-[60vh] overflow-y-auto leading-relaxed">
            </div>
        </div>
    </div>

    <!-- PWA 安裝提示 Toast -->
    <div id="pwa-toast" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-white border border-gray-300 p-3.5 rounded-2xl shadow-xl flex items-center justify-between text-xs z-30">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-amber-400 text-slate-900 rounded-lg flex items-center justify-center font-bold text-sm flex-shrink-0">
                <i class="fa-solid fa-mobile-screen"></i>
            </div>
            <div>
                <span id="ui-pwa-title" class="font-bold text-gray-900 block">安裝為 App 獲得最佳體驗</span>
                <span id="pwa-instructions" class="text-gray-500">點擊瀏覽器「分享」並選擇「加入主畫面」</span>
            </div>
        </div>
        <button onclick="document.getElementById('pwa-toast').remove()" class="text-gray-400 p-1">
            <i class="fa-solid fa-xmark text-base"></i>
        </button>
    </div>

    <!-- 核心邏輯 -->
    <script>

                    engineering: "Engineering Controls",
                    administrative: "Administrative Controls",
                    ppe: "PPE",
                    riskLevel: "Risk Level"
                }
            },
            de: {
                title: "Sicherheitskultur & Bewusstsein",
                titleHint: "💡 Titel 3s gedrückt halten für Genehmigung",
                btnSearch: "ID Suche",
                btnCamera: "QR Scannen",
                btnDb: "Datenbank",
                searchTitle: "Serien-ID zur Suche eingeben",
                searchHint: "Format: Kategorie-Bedeutung(-Stufe)",
                cancel: "Abbrechen",
                confirm: "Bestätigen",
                scannerTitle: "QR-Code ausrichten",
                adminTitle: "Genehmigungs-Matrix Warteschlange",
                pwaTitle: "App installieren für beste Erfahrung",
                uniqueQr: "Eindeutiger QR-Code",
                subDirHeader: "Warnzeichen Unterverzeichnis-Matrix",
                boxHint: "Doppelklick zum Senden / 3s halten zum Öffnen",
                noData: "Keine Daten vorhanden",
                detailTitle: "Detaillierter Inhalt",
                level: "Stufe",
                dbHeader: "ISO 7010 Schild-Datenbank",
                total: "Gesamt",
                items: "Einträge",
                approve: "Genehmigen",
                reject: "Ablehnen",
                emptyAdmin: "Keine ausstehenden Anträge.",
                cameraDenied: "Kamerazugriff verweigert, zurück zur Hauptseite.",
                pendingAlert: "Eingereicht! Eintrag befindet sich im Status 'Ausstehend'.",
                fields: {
                    frequency: "Häufigkeit",
                    elimination: "Beseitigung",
                    substitution: "Substitution",
                    engineering: "Technische Schutzmaßnahmen",

                    riskLevel: "Risikostufe"
                }
            }
        };

        // ====== 2. ISO 7010 資料庫 ======
        const defaultDatabase = [
            {
                id: "W-ElectricDanger-L4",
                category: "W",
                categoryName: { zh: "警告標誌", en: "Warning Sign", de: "Warnzeichen" },
                name: { zh: "感電注意 (Electricity Danger)", en: "Electricity Danger", de: "Warnung vor gefährlicher elektrischer Spannung" },
                level: 4,
                iconClass: "fa-bolt",

            {

                category: "M",
                categoryName: { zh: "強制標誌", en: "Mandatory Sign", de: "Gebotszeichen" },
                name: { zh: "佩戴護目鏡 (Wear Eye Protection)", en: "Wear Eye Protection", de: "Augenschutz tragen" },

                fields: null,

                category: "E",

                iconClass: "fa-kit-medical"

                id: "F-Extinguisher",
                category: "F",
                categoryName: { zh: "消防標誌", en: "Fire Safety Sign", de: "Brandschutzzeichen" },
                name: { zh: "滅火器 (Fire Extinguisher)", en: "Fire Extinguisher", de: "Feuerlöscher" },
                level: null,
                fields: null,
                iconClass: "fa-fire-extinguisher"
            }
        ];

        let database = JSON.parse(localStorage.getItem('iso7010_db')) || defaultDatabase;
        let approvalQueue = JSON.parse(localStorage.getItem('iso7010_queue')) || [];
        let currentSignId = "W-ElectricDanger-L4";

        function saveDB() { localStorage.setItem('iso7010_db', JSON.stringify(database)); }
        function saveQueue() { localStorage.setItem('iso7010_queue', JSON.stringify(approvalQueue)); }

        // ====== 3. 語言切換邏輯 ======
        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('iso7010_lang', lang);
            document.getElementById('lang-select').value = lang;
            applyTranslations();
            renderSignDetail(currentSignId);
        }

        function applyTranslations() {
            const t = i18n[currentLang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-title-hint').innerText = t.titleHint;
            document.getElementById('ui-btn-search').innerText = t.btnSearch;
            document.getElementById('ui-btn-camera').innerText = t.btnCamera;
            document.getElementById('ui-btn-db').innerText = t.btnDb;
            document.getElementById('ui-search-title').innerText = t.searchTitle;
            document.getElementById('ui-search-hint').innerText = t.searchHint;
            document.getElementById('ui-cancel-btn').innerText = t.cancel;
            document.getElementById('ui-confirm-btn').innerText = t.confirm;
            document.getElementById('ui-scanner-title').innerText = t.scannerTitle;
            document.getElementById('ui-admin-title').innerText = t.adminTitle;
            document.getElementById('ui-pwa-title').innerText = t.pwaTitle;
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            applyTranslations();
            renderSignDetail(currentSignId);
            initLongPressAdmin();
            setupPWAInstructions();
        });

        // ====== 4. 主標題長按 3 秒進入後台審批 ======
        function initLongPressAdmin() {
            let pressTimer = null;
            const titleEl = document.getElementById('main-title');

            function startPress() {
                pressTimer = setTimeout(() => { openAdminModal(); }, 3000);
            }
            function cancelPress() { if (pressTimer) clearTimeout(pressTimer); }

            titleEl.addEventListener('touchstart', startPress, { passive: true });
            titleEl.addEventListener('touchend', cancelPress);
            titleEl.addEventListener('touchcancel', cancelPress);
            titleEl.addEventListener('mousedown', startPress);
            titleEl.addEventListener('mouseup', cancelPress);
            titleEl.addEventListener('mouseleave', cancelPress);
        }

        // ====== 5. 渲染標誌詳情頁 ======
        function renderSignDetail(id) {
            currentSignId = id;
            const item = database.find(x => x.id === id);
            const container = document.getElementById('app-content');
            const t = i18n[currentLang];

            if (!item) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl text-center border border-gray-200 shadow-sm">
                        <i class="fa-solid fa-circle-exclamation text-amber-500 text-4xl mb-3"></i>
                        <h3 class="font-bold text-gray-800">${t.noData}</h3>
                        <p class="text-xs text-gray-500 mt-1">ID: ${id}</p>
                        <button onclick="showDatabaseView()" class="mt-4 bg-amber-400 px-4 py-2 rounded-xl text-xs font-bold">${t.btnDb}</button>
                    </div>`;
                return;
            }

            // ISO 7010 黃色警告三角形與等級呈現
            let visualHtml = '';
            if (item.category === 'W') {
                visualHtml = `
                    <div class="flex flex-col items-center">
                        <div class="iso-triangle-container">
                            <i class="fa-solid ${item.iconClass} iso-triangle-icon"></i>
                        </div>
                        <div class="mt-2 text-center">
                            <span class="text-xs font-black text-amber-900 bg-amber-300 px-3 py-0.5 rounded-full border border-amber-400 shadow-sm">
                                ${t.level} ${item.level}
                            </span>
                        </div>
                    </div>`;
            } else {
                let bgClass = item.category === 'P' ? 'bg-red-600' : (item.category === 'M' ? 'bg-blue-600' : 'bg-emerald-600');
                visualHtml = `
                    <div class="flex flex-col items-center">
                        <div class="w-18 h-18 ${bgClass} iso-circle flex items-center justify-center text-white text-3xl shadow-sm">
                            <i class="fa-solid ${item.iconClass}"></i>
                        </div>
                    </div>`;
            }

            // 子目錄 6 大資訊 + 風險等級
            let fieldsHtml = '';
            if (item.fields) {
                const mapKeys = [
                    { key: 'frequency', label: t.fields.frequency },
                    { key: 'elimination', label: t.fields.elimination },
                    { key: 'substitution', label: t.fields.substitution },
                    { key: 'engineering', label: t.fields.engineering },
                    { key: 'administrative', label: t.fields.administrative },
                    { key: 'ppe', label: t.fields.ppe },
                    { key: 'riskLevel', label: t.fields.riskLevel, isRed: true }
                ];

                let cardsHtml = mapKeys.map(info => {
                    const list = item.fields[info.key] || [];
                    const itemsText = list.join('； ');

                    return `
                        <div ondblclick="triggerDoubleClickSubmit('${item.id}', '${info.key}', '${info.label}')" 
                             data-label="${info.label}"
                             data-text="${itemsText || t.noData}"
                             class="field-box p-3 ${info.isRed ? 'bg-red-50/70 border-red-200' : 'bg-gray-50 border-gray-200'} border rounded-xl relative hover:border-amber-400 transition cursor-pointer select-none">
                            <div class="flex justify-between items-center mb-1 pointer-events-none">
                                <span class="text-[11px] font-bold ${info.isRed ? 'text-red-700' : 'text-gray-500'}">${info.label}</span>
                                <span class="text-[9px] text-gray-300">${t.boxHint}</span>
                            </div>
                            <div class="text-xs text-gray-800 font-medium truncate-text pointer-events-none">
                                ${itemsText || `<span class="text-gray-300 italic">${t.noData}</span>`}
                            </div>
                        </div>`;
                }).join('');

                fieldsHtml = `
                    <div class="space-y-3 pt-2">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-gray-800 flex items-center gap-1.5">
                                <i class="fa-solid fa-list-check text-amber-500"></i> ${t.subDirHeader}
                            </h4>
                        </div>
                        <div class="grid grid-cols-1 gap-2.5">
                            ${cardsHtml}
                        </div>
                    </div>`;
            }

            const catName = typeof item.categoryName === 'object' ? item.categoryName[currentLang] : item.categoryName;
            const signName = typeof item.name === 'object' ? item.name[currentLang] : item.name;

            container.innerHTML = `
                <div class="bg-white rounded-2xl border border-gray-200 p-5 shadow-sm space-y-4">
                    <div class="flex justify-between items-start border-b border-gray-100 pb-3">
                        <div>
                            <span class="text-xs font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-200">${catName}</span>
                            <h3 class="text-base font-bold text-gray-900 mt-1">${signName}</h3>
                        </div>
                        <span class="text-[11px] font-mono font-bold bg-gray-100 px-2 py-1 rounded text-gray-600 border border-gray-200">
                            ${item.id}
                        </span>
                    </div>

                    <div class="flex items-center justify-around py-4 bg-gray-50/80 rounded-2xl border border-gray-100">
                        ${visualHtml}
                        <div class="flex flex-col items-center">
                            <div id="qrcode-box" class="p-2 bg-white rounded-xl border border-gray-200 shadow-sm"></div>
                            <span class="text-[10px] text-gray-400 mt-1">${t.uniqueQr}</span>
                        </div>
                    </div>

                    ${fieldsHtml}
                </div>`;

            // 動態生成 QR Code
            setTimeout(() => {
                const box = document.getElementById("qrcode-box");
                if (box) {
                    box.innerHTML = "";
                    new QRCode(box, { text: item.id, width: 70, height: 70 });
                }
                bindLongPressEvents();
            }, 50);
        }

        // 綁定長按 3 秒展開內容
        function bindLongPressEvents() {
            const boxes = document.querySelectorAll('.field-box');
            boxes.forEach(box => {
                let timer = null;
                const label = box.getAttribute('data-label');
                const text = box.getAttribute('data-text');

                function start() {
                    timer = setTimeout(() => { openDetailModal(label, text); }, 3000);
                }
                function cancel() { if (timer) clearTimeout(timer); }

                box.addEventListener('touchstart', start, { passive: true });
                box.addEventListener('touchend', cancel);
                box.addEventListener('touchcancel', cancel);
                box.addEventListener('mousedown', start);
                box.addEventListener('mouseup', cancel);
                box.addEventListener('mouseleave', cancel);
            });
        }

        function openDetailModal(title, content) {
            document.getElementById('detail-modal-title').innerText = title;
            document.getElementById('detail-modal-body').innerText = content;
            document.getElementById('detail-modal').classList.remove('hidden');
        }
        function closeDetailModal() { document.getElementById('detail-modal').classList.add('hidden'); }

        // ====== 6. 雙擊框格提交輸入 ======
        function triggerDoubleClickSubmit(signId, fieldKey, fieldLabel) {
            const t = i18n[currentLang];
            const userInput = prompt(`[${fieldLabel}]\nPath: ${signId}\n\nEnter new details:`);
            if (userInput && userInput.trim() !== '') {
                const record = {
                    id: Date.now(),
                    signId: signId,
                    fieldKey: fieldKey,
                    fieldLabel: fieldLabel,
                    content: userInput.trim(),
                    time: new Date().toLocaleString()
                };

                approvalQueue.push(record);
                saveQueue();
                alert(t.pendingAlert);
            }
        }

        // ====== 7. 📦 完整資料庫檢視 ======
        function showDatabaseView() {
            const container = document.getElementById('app-content');
            const t = i18n[currentLang];

            let cards = database.map(item => {
                const signName = typeof item.name === 'object' ? item.name[currentLang] : item.name;
                return `
                <div onclick="renderSignDetail('${item.id}')" class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm flex items-center justify-between active:scale-[0.98] transition cursor-pointer">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 ${item.category === 'W' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'} rounded-xl flex items-center justify-center text-lg font-bold">
                            <i class="fa-solid ${item.iconClass}"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-sm text-gray-900">${signName}</h4>
                            <span class="text-[10px] font-mono text-gray-400">${item.id}</span>
                        </div>
                    </div>
                    <div id="db-qr-${item.id}" class="w-10 h-10 border p-0.5 rounded bg-white flex-shrink-0"></div>
                </div>`;
            }).join('');

            container.innerHTML = `
                <div class="space-y-3">
                    <div class="flex justify-between items-center mb-1">
                        <h3 class="font-bold text-gray-800 text-sm">${t.dbHeader}</h3>
                        <span class="text-xs text-gray-400">${t.total} ${database.length} ${t.items}</span>
                    </div>
                    ${cards}
                </div>`;

            setTimeout(() => {
                database.forEach(item => {
                    const el = document.getElementById(`db-qr-${item.id}`);
                    if (el) new QRCode(el, { text: item.id, width: 36, height: 36 });
                });
            }, 50);
        }

        // ====== 8. T 搜尋 & 📷 相機 Modal ======
        function openSearchModal() { document.getElementById('search-modal').classList.remove('hidden'); }
        function closeSearchModal() { document.getElementById('search-modal').classList.add('hidden'); }
        function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (query) {
                closeSearchModal();
                renderSignDetail(query);
            }
        }

        let html5QrCode = null;
        function openScannerModal() {
            const t = i18n[currentLang];
            document.getElementById('scanner-modal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 200, height: 200 } },
                (decodedText) => {
                    closeScannerModal();
                    renderSignDetail(decodedText);
                },
                (err) => {}
            ).catch((err) => {
                alert(t.cameraDenied);
                closeScannerModal();
            });
        }

        function closeScannerModal() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    html5QrCode = null;
                    document.getElementById('scanner-modal').classList.add('hidden');
                }).catch(() => {
                    document.getElementById('scanner-modal').classList.add('hidden');
                    html5QrCode = null;
                });
            } else {
                document.getElementById('scanner-modal').classList.add('hidden');
            }
        }

        // ====== 9. 後台審批流程 (Admin Modal) ======
        function openAdminModal() {
            const queueContainer = document.getElementById('admin-queue');
            const t = i18n[currentLang];

            if (approvalQueue.length === 0) {
                queueContainer.innerHTML = `<p class="text-xs text-gray-400 text-center py-8">${t.emptyAdmin}</p>`;
            } else {
                queueContainer.innerHTML = approvalQueue.map(item => `
                    <div class="p-3 bg-gray-50 border border-gray-200 rounded-xl space-y-2 text-xs">
                        <div class="flex justify-between font-bold text-gray-700">
                            <span>ID: ${item.signId}</span>
                            <span class="text-[10px] text-gray-400">${item.time}</span>
                        </div>
                        <div class="text-amber-800 font-bold bg-amber-50 p-1.5 rounded border border-amber-200">
                            ${item.fieldLabel}
                        </div>
                        <div class="text-gray-800 bg-white p-2 rounded border border-gray-100">
                            ${item.content}
                        </div>
                        <div class="flex justify-end space-x-2 pt-1">
                            <button onclick="rejectApproval(${item.id})" class="px-3 py-1 bg-gray-200 text-gray-700 rounded font-bold">${t.reject}</button>
                            <button onclick="approveApproval(${item.id})" class="px-3 py-1 bg-emerald-600 text-white rounded font-bold">${t.approve}</button>
                        </div>
                    </div>`).join('');
            }
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }

        function approveApproval(id) {
            const item = approvalQueue.find(x => x.id === id);
            if (item) {
                const target = database.find(x => x.id === item.signId);
                if (target && target.fields) {
                    if (!target.fields[item.fieldKey]) target.fields[item.fieldKey] = [];
                    target.fields[item.fieldKey].push(item.content);
                    saveDB();
                }

                approvalQueue = approvalQueue.filter(x => x.id !== id);
                saveQueue();

                openAdminModal();
                renderSignDetail(item.signId);
            }
        }

        function rejectApproval(id) {
            approvalQueue = approvalQueue.filter(x => x.id !== id);
            saveQueue();
            openAdminModal();
        }

        function setupPWAInstructions() {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const el = document.getElementById('pwa-instructions');
            if (isIOS) {
                el.innerHTML = '點擊下方 <i class="fa-solid fa-share-from-square text-amber-500"></i> 分享，選擇<b>「加入主畫面」</b>';
            } else {
                el.innerHTML = '點擊瀏覽器選單，選擇<b>「安裝應用程式」</b>';
            }
            if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
                document.getElementById('pwa-toast').style.display = 'none';
            }
        }
    </script>
</body>
</html>
